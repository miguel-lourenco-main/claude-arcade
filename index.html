<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Arcade</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #16191f;
    --border: #262b33;
    --text: #e8eaed;
    --dim: #8b93a1;
    --accent: #7ee787;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 28px; letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  header p { color: var(--dim); margin-top: 8px; font-size: 14px; }
  #games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card .tagrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .tag { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .card .badge {
    font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
    border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; color: var(--dim);
    white-space: nowrap;
  }
  .card .badge.mobile { color: var(--accent); border-color: rgba(126,231,135,0.4); }
  .card p { color: var(--dim); font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center; }
  .filters button {
    appearance: none; cursor: pointer; background: var(--panel); color: var(--dim);
    border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font: inherit; font-size: 12px;
  }
  .filters button.on { color: var(--text); border-color: var(--accent); }
  .filters button:hover { color: var(--text); }
  footer { margin-top: auto; padding-top: 40px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>CLAUDE <span>ARCADE</span></h1>
    <p>Classic games, rebuilt from scratch. Static HTML, no build step.</p>
  </header>
  <div class="filters" id="filters">
    <button data-filter="all" class="on">All games</button>
    <button data-filter="mobile">📱 Plays on mobile</button>
    <button data-filter="desktop">🖥 Desktop</button>
  </div>
  <main id="games"></main>
  <footer>Serve statically (e.g. <code>python3 -m http.server</code>) and play. Got an idea? Tap ★ Ideas.</footer>

  <script src="games/manifest.js"></script>
  <script>
    const grid = document.getElementById("games");
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    for (const g of window.GAMES) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = "games/" + g.slug + "/index.html";
      card.dataset.mobile = g.mobile ? "1" : "0";
      const badge = g.mobile
        ? '<span class="badge mobile">📱 Mobile</span>'
        : '<span class="badge">🖥 Desktop</span>';
      card.innerHTML =
        '<div class="tagrow"><div class="tag">' + esc(g.genre) + "</div>" + badge + "</div>" +
        "<h2>" + esc(g.title) + "</h2>" +
        "<p>" + esc(g.description) + "</p>";
      grid.appendChild(card);
    }

    const filterBtns = document.querySelectorAll("#filters button");
    function applyFilter(mode) {
      for (const b of filterBtns) b.classList.toggle("on", b.dataset.filter === mode);
      for (const card of grid.children) {
        const isMobile = card.dataset.mobile === "1";
        const show = mode === "all" || (mode === "mobile" ? isMobile : !isMobile);
        card.style.display = show ? "" : "none";
      }
    }
    for (const b of filterBtns) b.addEventListener("click", () => applyFilter(b.dataset.filter));
    // On a touch/phone-sized device, lead with the games that actually play there.
    const smallTouch = matchMedia("(max-width: 760px)").matches && "ontouchstart" in window;
    if (smallTouch) applyFilter("mobile");
  </script>

  <!-- shared arcade widget: player ideas + roadmap (no "Rules" on the landing) -->
  <script src="games/_common/arcade-config.js"></script>
  <script src="games/_common/arcade-widget.js"></script>
  <script>
    ArcadeWidget.init({ slug: "arcade", title: "Claude Arcade", hideRules: true });
  </script>
</body>
</html>
