<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Arcade</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #16191f;
    --border: #262b33;
    --text: #e8eaed;
    --dim: #8b93a1;
    --accent: #7ee787;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 28px; letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  header p { color: var(--dim); margin-top: 8px; font-size: 14px; }
  #games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .card .tag { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .card p { color: var(--dim); font-size: 13px; margin-top: 10px; line-height: 1.5; }
  footer { margin-top: auto; padding-top: 40px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>CLAUDE <span>ARCADE</span></h1>
    <p>Classic games, rebuilt from scratch. Static HTML, no build step.</p>
  </header>
  <main id="games"></main>
  <footer>Serve statically (e.g. <code>python3 -m http.server</code>) and play.</footer>

  <script src="games/manifest.js"></script>
  <script>
    const grid = document.getElementById("games");
    for (const g of window.GAMES) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = "games/" + g.slug + "/index.html";
      card.innerHTML =
        '<div class="tag">' + g.genre + "</div>" +
        "<h2>" + g.title + "</h2>" +
        "<p>" + g.description + "</p>";
      grid.appendChild(card);
    }
  </script>
</body>
</html>
