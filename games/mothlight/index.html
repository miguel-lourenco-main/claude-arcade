<!DOCTYPE html>
<html lang="en">
<head>

<title>Mothlight</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <canvas id="game" width="480" height="720"></canvas>
    <div id="chrome">
      <a href="../../index.html" class="back">&larr; Arcade</a>

    </div>
  </div>
