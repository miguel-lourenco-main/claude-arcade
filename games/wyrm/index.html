<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyrm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="frame">
    <header id="topbar">
      <a href="../../index.html" class="back">&larr; Arcade</a>
      <h1>WYRM</h1>
      <button id="audio-toggle" type="button" title="toggle sound">sound: on</button>
    </header>

    <div id="hud">
      <div class="stat"><span class="label">score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">best</span><span id="best">0</span></div>
      <div class="stat"><span class="label">length</span><span id="length">4</span></div>
      <div class="stat"><span class="label">speed</span><span id="speed">1.0x</span></div>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="overlay" class="show">
        <div class="panel">
          <div id="overlay-title">WYRM</div>
          <div id="overlay-sub">press any direction to slither</div>
          <div id="overlay-score"></div>
        </div>
      </div>
    </div>

    <footer id="controls">
      <span><b>&uarr;&darr;&larr;&rarr;</b> / <b>WASD</b> steer</span>
      <span><b>P</b> pause</span>
      <span><b>M</b> sound</span>
      <span><b>any key</b> restart</span>
    </footer>
  </main>

  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
