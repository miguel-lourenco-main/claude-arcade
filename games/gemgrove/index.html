<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemgrove</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="frame">
    <header id="topbar">
      <a href="../../index.html" class="back">&larr; Arcade</a>
      <h1>GEMGROVE</h1>
      <button id="audio-toggle" type="button" title="toggle sound">sound: on</button>
    </header>

    <div id="hud">
      <div class="stat"><span class="label">level</span><span id="level">1</span></div>
      <div class="stat"><span class="label">moves</span><span id="moves">-</span></div>
      <div class="stat"><span class="label">score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">best</span><span id="best">0</span></div>
    </div>

    <div id="goal">
      <div id="goal-bar"><div id="goal-fill"></div></div>
      <div id="goal-text">0 / 0</div>
    </div>

    <div id="stage">
      <canvas id="game" width="480" height="480"></canvas>
      <div id="overlay" class="show">
        <div class="panel">
          <div id="overlay-title">GEMGROVE</div>
          <div id="overlay-sub">click to begin</div>
          <div id="overlay-detail"></div>
        </div>
      </div>
      <div id="toast"></div>
    </div>

    <footer id="controls">
      <span><b>click</b> a gem, then a neighbour &mdash; or <b>drag</b></span>
      <span><b>P</b> pause</span>
      <span><b>M</b> sound</span>
      <span><b>R</b> retry level</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
