<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardfield</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="frame">
    <header id="topbar">
      <a href="../../index.html" class="back">&larr; Arcade</a>
      <h1>SHARDFIELD</h1>
      <button id="audio-toggle" type="button" title="toggle sound">sound: on</button>
    </header>

    <div id="hud">
      <div class="stat"><span class="label">score</span><span id="score">0</span></div>
      <div class="stat"><span class="label">best</span><span id="best">0</span></div>
      <div class="stat"><span class="label">wave</span><span id="wave">&mdash;</span></div>
      <div class="stat"><span class="label">ships</span><span id="lives">&mdash;</span></div>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="overlay" class="show">
        <div class="panel">
          <div id="overlay-title">SHARDFIELD</div>
          <div id="overlay-sub">drift &middot; split &middot; survive</div>
          <div id="overlay-msg">press ENTER to launch</div>
        </div>
      </div>
    </div>

    <footer id="controls">
      <span><b>&larr;&rarr;</b>/<b>AD</b> rotate</span>
      <span><b>&uarr;</b>/<b>W</b> thrust</span>
      <span><b>Space</b> fire</span>
      <span><b>P</b> pause</span>
      <span><b>M</b> sound</span>
      <span><b>Enter</b> start</span>
    </footer>
  </main>

  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
